<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RtG End-to-end Playback Benchmark</title>
</head>

<body>
    <video id="source" muted playsinline></video>
    <canvas id="preview" width="420" height="420"></canvas>
    <pre id="results">Loading...</pre>
    <script type="module">
        import {
            processVideoFrame,
            renderQuantizedGrid,
        } from "./preview.js";

        const SOURCE = new URLSearchParams(window.location.search).get("video") || "synthetic_test.mp4";
        const query = new URLSearchParams(window.location.search);
        const requestedDimension = Number(query.get("dimension"));
        const DIMENSIONS = Number.isInteger(requestedDimension) && requestedDimension >= 2
            ? [requestedDimension]
            : [16, 32, 64, 96, 128];
        const MAX_FRAMES = Number(query.get("frames") || 180);
        const palette = [[0, 0, 0], [255, 255, 255], [128, 128, 128]];
        const video = document.querySelector("#source");
        const canvas = document.querySelector("#preview");
        const context = canvas.getContext("2d", { willReadFrequently: true });
        const sourceCanvas = document.createElement("canvas");
        const sourceContext = sourceCanvas.getContext("2d", { willReadFrequently: true });

        const checksum = (quantized) => {
            let total = 0;
            for (let index = 0; index < quantized.length; index += 4) {
                total += quantized[index] + quantized[index + 1] + quantized[index + 2];
            }
            return total;
        };

        const seekToStart = () => new Promise((resolve, reject) => {
            const onSeeked = () => resolve();
            const onError = () => reject(new Error("Video seek failed"));
            video.addEventListener("seeked", onSeeked, { once: true });
            video.addEventListener("error", onError, { once: true });
            video.currentTime = 0;
        });

        const nextVideoFrame = () => new Promise((resolve) => {
            if (typeof video.requestVideoFrameCallback === "function") {
                video.requestVideoFrameCallback((now, metadata) => resolve({ now, metadata, mode: "requestVideoFrameCallback" }));
            } else {
                requestAnimationFrame((now) => resolve({ now, metadata: null, mode: "requestAnimationFrame" }));
            }
        });

        async function benchmarkDimension(dimension) {
            await seekToStart();
            const processTimes = [];
            const renderTimes = [];
            let totalChecksum = 0;
            let framesProcessed = 0;
            let skippedFrames = 0;
            let previousPresentedFrames = null;
            let callbackMode = null;
            const benchmarkStart = performance.now();
            const playbackStart = performance.now();
            await video.play();

            while (framesProcessed < MAX_FRAMES && !video.ended) {
                const callback = await nextVideoFrame();
                callbackMode = callback.mode;
                const presentedFrames = callback.metadata?.presentedFrames;
                if (presentedFrames !== undefined && previousPresentedFrames !== null) {
                    skippedFrames += Math.max(0, presentedFrames - previousPresentedFrames - 1);
                }
                if (presentedFrames !== undefined) previousPresentedFrames = presentedFrames;

                const processed = processVideoFrame(
                    video,
                    sourceCanvas,
                    sourceContext,
                    dimension,
                    dimension,
                    palette,
                );
                processTimes.push(processed.processMs);
                const renderStart = performance.now();
                renderQuantizedGrid(context, processed.quantized, dimension, dimension);
                renderTimes.push(performance.now() - renderStart);
                totalChecksum += checksum(processed.quantized);
                framesProcessed += 1;
            }
            video.pause();
            const durationMs = performance.now() - benchmarkStart;
            const playbackDurationMs = performance.now() - playbackStart;
            const processMs = processTimes.reduce((sum, value) => sum + value, 0);
            const renderMs = renderTimes.reduce((sum, value) => sum + value, 0);
            const totalMs = processMs + renderMs;
            return {
                width: dimension,
                height: dimension,
                pixels: dimension * dimension,
                frames_processed: framesProcessed,
                frames_skipped: skippedFrames,
                duration_ms: durationMs,
                playback_duration_ms: playbackDurationMs,
                process_ms: processMs,
                render_ms: renderMs,
                total_ms: totalMs,
                process_ms_per_frame: framesProcessed ? processMs / framesProcessed : 0,
                render_ms_per_frame: framesProcessed ? renderMs / framesProcessed : 0,
                total_ms_per_frame: framesProcessed ? totalMs / framesProcessed : 0,
                effective_fps: durationMs ? framesProcessed * 1000 / durationMs : 0,
                callback_mode: callbackMode,
                checksum_sum: totalChecksum,
            };
        }

        async function main() {
            video.src = SOURCE;
            await new Promise((resolve, reject) => {
                video.addEventListener("loadedmetadata", resolve, { once: true });
                video.addEventListener("error", () => reject(new Error(`Could not load ${SOURCE}`)), { once: true });
            });
            sourceCanvas.width = video.videoWidth;
            sourceCanvas.height = video.videoHeight;
            const results = [];
            for (const dimension of DIMENSIONS) results.push(await benchmarkDimension(dimension));
            window.benchmarkResults = {
                benchmark: "End-to-end playback benchmark",
                source: {
                    url: SOURCE,
                    width: video.videoWidth,
                    height: video.videoHeight,
                    duration_s: video.duration,
                    fps: video.getVideoPlaybackQuality ? undefined : null,
                },
                palette,
                results,
            };
            document.querySelector("#results").textContent = JSON.stringify(window.benchmarkResults, null, 2);
            document.body.dataset.ready = "true";
        }

        main().catch((error) => {
            document.body.dataset.error = error.message;
            document.querySelector("#results").textContent = error.stack || error.message;
        });
    </script>
</body>

</html>
